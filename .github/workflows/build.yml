name: Build Alenia Fuse CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package builder
        run: python -m pip install --upgrade build

      - name: Build Python Package
        run: python -m build --outdir dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuse-dist
          path: dist/*

  build-ffmpeg-assets:
    name: Prepare FFmpeg release assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Windows FFmpeg build
        run: curl -fL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -o fuse-ffmpeg-windows-x64.zip

      - name: Download Linux FFmpeg build
        run: curl -fL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o fuse-ffmpeg-linux-x64.tar.xz

      - name: Create checksums
        run: sha256sum fuse-ffmpeg-windows-x64.zip > fuse-ffmpeg-windows-x64.zip.sha256 && sha256sum fuse-ffmpeg-linux-x64.tar.xz > fuse-ffmpeg-linux-x64.tar.xz.sha256

      - name: Upload FFmpeg assets
        uses: actions/upload-artifact@v4
        with:
          name: fuse-ffmpeg
          path: |
            fuse-ffmpeg-windows-x64.zip
            fuse-ffmpeg-windows-x64.zip.sha256
            fuse-ffmpeg-linux-x64.tar.xz
            fuse-ffmpeg-linux-x64.tar.xz.sha256

  release:
    needs: [build, build-ffmpeg-assets]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/fuse-dist/*
            artifacts/fuse-ffmpeg/*

  publish-pypi:
    name: Publish package to PyPI
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/alenia-fuse
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: fuse-dist
          path: dist

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
