[project]
name = "alenia-porter"
version = "7.1.0"
description = "Alenia Porter — Professional multimedia CLI and Python library"
readme = "README.md"
authors = [
    { name = "Alejandro Martinez", email = "contact.aleniastudios@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.40"
]

[project.scripts]
porter = "alenia_porter.cli.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alenia_porter = [
    "py.typed",
    "i18n/locales/*.json"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
timeout = 60
