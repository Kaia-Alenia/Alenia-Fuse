[project]
name = "alenia-fuse"
version = "2.0.5"
description = "Alenia Fuse — Professional multimedia CLI and Python library"
readme = "README.md"
authors = [
    { name = "Alejandro Martinez", email = "contact.aleniastudios@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.40",
    "Pillow>=10.0.0"
]

[project.scripts]
fuse = "fuse.cli.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fuse = [
    "py.typed",
    "i18n/locales/*.json"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
timeout = 60

[tool.ruff.lint]
ignore = ["BLE001", "S110", "RUF012", "RUF013", "SIM102", "F401", "UP035"]
